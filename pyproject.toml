[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ym-remote"
version = "1.0.0"
description = "Пульт Яндекс Музыки для телефона в локальной сети"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "yandex-music",
    "aiohttp",
    "pillow",
    "qrcode[pil]",
    "websocket-client",
]

[project.urls]
Homepage = "https://github.com/Ch3vg/yandex-music-remote"
Repository = "https://github.com/Ch3vg/yandex-music-remote"
Issues = "https://github.com/Ch3vg/yandex-music-remote/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
